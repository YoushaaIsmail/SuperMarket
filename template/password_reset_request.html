<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعادة تعيين كلمة المرور</title>
    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background: #0f1825;
            font-family: 'Tahoma', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .reset-card {
            background: #141e2d;
            border: 1px solid #25324a;
            border-radius: 16px;
            padding: 40px 35px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .reset-card .brand {
            text-align: center;
            margin-bottom: 30px;
        }
        .reset-card .brand i {
            font-size: 3rem;
            color: #4a90d9;
        }
        .reset-card .brand h3 {
            color: #ffffff;
            margin-top: 10px;
            font-weight: 600;
        }
        .reset-card .brand p {
            color: #8a9bb5;
            font-size: 0.9rem;
        }
        .form-control-modern {
            background: #0f1825;
            border: 1px solid #25324a;
            color: #b8c9e0;
            padding: 12px 16px;
            border-radius: 10px;
            transition: border-color 0.2s;
        }
        .form-control-modern:focus {
            background: #0f1825;
            border-color: #4a90d9;
            color: #ffffff;
            box-shadow: 0 0 0 3px rgba(74, 144, 217, 0.25);
        }
        .form-control-modern::placeholder {
            color: #5a6b85;
        }
        .btn-primary-custom {
            background: #4a90d9;
            border: none;
            color: #ffffff;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            transition: background 0.2s;
            width: 100%;
        }
        .btn-primary-custom:hover {
            background: #3a7bc8;
            color: #ffffff;
        }
        .btn-primary-custom i {
            margin-left: 8px;
        }
        .alert-modern {
            background: rgba(74, 144, 217, 0.1);
            border: 1px solid #4a90d9;
            color: #6ea8fe;
            border-radius: 10px;
            padding: 12px 16px;
        }
        .alert-modern-danger {
            background: rgba(220, 53, 69, 0.1);
            border: 1px solid #dc3545;
            color: #f28b82;
        }
        .alert-modern-success {
            background: rgba(40, 167, 69, 0.1);
            border: 1px solid #28a745;
            color: #6fcf97;
        }
        .link-light {
            color: #8a9bb5;
            text-decoration: none;
            transition: color 0.2s;
        }
        .link-light:hover {
            color: #b8c9e0;
            text-decoration: underline;
        }
        .footer-text {
            color: #5a6b85;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 20px;
            border-top: 1px solid #1e2a3d;
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="reset-card">
        <div class="brand">
            <i class="fas fa-key"></i>
            <h3>إعادة تعيين كلمة المرور</h3>
            <p>أدخل بريدك الإلكتروني المسجل</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-modern {% if message.tags == 'error' %}alert-modern-danger{% elif message.tags == 'success' %}alert-modern-success{% endif %} alert-dismissible fade show" role="alert">
                    <i class="fas {% if message.tags == 'error' %}fa-exclamation-circle{% else %}fa-check-circle{% endif %} me-2"></i>
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" style="filter: invert(1);"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="email" class="form-label text-white-50">البريد الإلكتروني</label>
                <input type="email" name="email" id="email" class="form-control form-control-modern" placeholder="example@domain.com" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary-custom">
                <i class="fas fa-paper-plane"></i> إرسال كلمة المرور الجديدة
            </button>
        </form>

        <div class="text-center mt-3">
            <a href="{% url 'app:login' %}" class="link-light">
                <i class="fas fa-arrow-right me-1"></i> العودة إلى تسجيل الدخول
            </a>
        </div>

        <div class="footer-text">
            <i class="fas fa-shield-alt me-1"></i> نظام إدارة المحاسبة
        </div>
    </div>

    <!-- Bootstrap JS (اختياري للإغلاق) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
